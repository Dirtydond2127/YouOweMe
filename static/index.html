<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><meta name="description" content="Private shared cost tracking"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" href="/static/icon-192.png"><link rel="apple-touch-icon" href="/static/icon-192.png"><link rel="stylesheet" href="/static/style.css"><title>OweTogether</title></head><body><div id="app"><p class="loading">Loading your workspace...</p></div><div id="message" role="status" aria-live="polite"></div><dialog id="entryDialog"><form id="entryForm"><div class="heading"><h2>Add an entry</h2><button type="button" id="closeDialog" class="quiet" aria-label="Close">✕</button></div><p class="muted">Keep track now. Square up later.</p><label>Direction<select name="direction"><option value="owed">They owe me</option><option value="owe">I owe them</option></select></label><label>Person<select name="person" id="personSelect" required></select></label><label>Description<input name="description" required maxlength="200" placeholder="What was it for?"></label><div class="fields"><label>Amount (£)<input name="amount" required type="number" min="0.01" max="1000000" step="0.01" placeholder="0.00"></label><label>Date<input name="date" type="date" required></label></div><p class="muted small">The other person must confirm this entry before it affects balances.</p><button type="submit" class="primary full">Save entry</button></form></dialog><script src="/static/app.js" defer></script></body></html>
